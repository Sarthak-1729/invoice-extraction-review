# Continuous integration. No secrets: the backend tests use the fake LLM
# provider with the network blocked, and the frontend tests use a fake api.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python 3.11)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Make sure no developer .env or real provider is ever picked up.
      LLM_PROVIDER: fake
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: backend/.python-version # 3.11.9

      - name: Check the Python version
        run: python -c "import sys; print(sys.version); assert sys.version_info[:2] == (3, 11)"

      - name: Install the backend into a fresh virtual environment
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/venv/bin/python" -m pip install -e "./backend[dev]"
          "$RUNNER_TEMP/venv/bin/python" -m pip check

      - name: Smoke test the installed package (outside the source folder)
        working-directory: ${{ runner.temp }}
        run: |
          python - <<'PY'
          from app.prompt import PROMPT_VERSION, load_prompt
          from app.testset_guard import TEST_SET_DIR, _manifest_hashes
          prompt = load_prompt()
          assert prompt.version == PROMPT_VERSION, prompt.version
          assert len(_manifest_hashes(TEST_SET_DIR.resolve())) == 24, "test-set manifest not found"
          print("prompt", prompt.version, prompt.sha256[:12], "| test-set guard sees 24 PDFs")
          PY

      - name: Ruff lint
        working-directory: backend
        run: python -m ruff check .

      - name: Ruff format check
        working-directory: backend
        run: python -m ruff format --check .

      - name: Frozen test-set hash (drift guard)
        run: python -m pytest -v -p no:cacheprovider eval/tests/test_testset_frozen.py

      - name: Backend tests with coverage
        working-directory: backend
        run: python -m pytest -p no:cacheprovider --cov --cov-report=term --cov-fail-under=96

      - name: Evaluation tests
        run: python -m pytest -q -p no:cacheprovider eval

  frontend:
    name: Frontend (Node 24)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc # 24.12.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install (exact versions from the lockfile)
        run: npm ci --no-fund --no-audit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
