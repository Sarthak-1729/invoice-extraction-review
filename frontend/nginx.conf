# Static review UI plus a reverse proxy for the API (same origin).
server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Uploads are limited to MAX_UPLOAD_MB (10 MB by default) by the API; this
    # lets a slightly larger request through so the API can answer with its
    # own FILE_TOO_LARGE error instead of an nginx page.
    client_max_body_size 12m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    # The PDF preview is an iframe from the same origin.
    add_header X-Frame-Options "SAMEORIGIN" always;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Extraction runs inside the upload request and can take minutes
        # (LLM call plus retries with backoff).
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /assets/ {
        expires 1y;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
