[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "invoice-extraction-review"
version = "0.1.0"
description = "Extract invoice fields from PDFs with an LLM, flag risky values, and review them."
license = "MIT"
# Pinned to 3.11 (the version every test and CI run uses). pip refuses to
# install into any other Python, e.g. a stray 3.14 virtual environment.
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115",
    "google-genai>=2.34",
    "pdfplumber>=0.11",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.0",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = [
    # Starlette's TestClient uses httpx2 (plain httpx is deprecated there).
    "httpx2>=2.0",
    "pytest>=8.3",
    "pytest-cov>=7.1",
    "reportlab>=4.2",  # builds encrypted and image-only PDFs in tests
    "ruff>=0.8",
]
# Synthetic dataset generator and evaluation (run from the repo root).
eval = [
    "reportlab>=4.2",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.prompts" = ["*/*.txt", "*/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# "AAA BBB".split() keeps long code lists readable.
ignore = ["SIM905"]

[tool.ruff.lint.isort]
known-first-party = ["app", "eval"]
